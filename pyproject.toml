[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hcmus-socket"
version = "0.1.0"
description = "HCMUS socket file transfer client and server"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hcmus-socket-client = "hcmus_socket.client.app:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
