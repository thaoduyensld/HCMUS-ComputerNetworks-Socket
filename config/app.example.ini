# Copy this file to app.ini and adjust values for your machine.
# app.ini is intentionally ignored by Git.

[server]
bind_address = 0.0.0.0
port = 4567
storage_directory = runtime/server_storage
max_clients = 10
partial_ttl_seconds = 86400

[client]
server_address = 127.0.0.1
server_port = 4567
connect_timeout_ms = 5000
download_directory = runtime/client_downloads

[network]
max_payload_bytes = 1048576
chunk_size_bytes = 32768
bandwidth_limit_kib_per_second = 500

[auth]
max_username_bytes = 32
